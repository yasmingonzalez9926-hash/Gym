<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#c41e3a"/>
      <stop offset="50%" stop-color="#165b33"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)"/>
  
  <!-- Snowflakes -->
  <text x="150" y="100" font-size="40" fill="white" opacity="0.8">❄</text>
  <text x="300" y="150" font-size="50" fill="white" opacity="0.9">❅</text>
  <text x="900" y="120" font-size="45" fill="white" opacity="0.85">❄</text>
  <text x="1050" y="180" font-size="38" fill="white" opacity="0.8">❆</text>
  <text x="180" y="650" font-size="42" fill="white" opacity="0.9">❅</text>
  <text x="1000" y="700" font-size="48" fill="white" opacity="0.85">❄</text>
  
  <!-- Christmas tree -->
  <polygon points="600,60 530,140 570,140 510,210 560,210 490,290 710,290 640,210 690,210 630,140 670,140" fill="#165b33"/>
  <polygon points="600,60 530,140 570,140 510,210 560,210 490,290 710,290 640,210 690,210 630,140 670,140" fill="#ffd700" opacity="0.3"/>
  <rect x="580" y="290" width="40" height="60" fill="#8B4513"/>
  <circle cx="600" cy="45" r="18" fill="url(#star)"/>
  
  <!-- Ornaments on tree -->
  <circle cx="600" cy="180" r="8" fill="#c41e3a"/>
  <circle cx="560" cy="220" r="8" fill="#ffd700"/>
  <circle cx="640" cy="230" r="8" fill="#fff"/>
  <circle cx="580" cy="260" r="8" fill="#c41e3a"/>
  <circle cx="620" cy="270" r="8" fill="#ffd700"/>
  
  <g transform="translate(80,380)">
    <rect x="0" y="0" width="1040" height="340" rx="24" fill="#fff" opacity="0.95"/>
    <text x="520" y="120" font-size="85" text-anchor="middle" fill="#c41e3a" font-family="Verdana" font-weight="bold">🎄 GYM FLOOR 🎅</text>
    <text x="520" y="220" font-size="45" text-anchor="middle" fill="#165b33" font-family="Verdana">Equipment Zone</text>
  </g>
